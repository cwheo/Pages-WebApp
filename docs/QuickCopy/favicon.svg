<?xml version="1.0" encoding="UTF-8"?>
<!-- QuickCopy 아이콘 마스터 벡터 — 겹쳐진 두 장의 카드(복사) + 번개(빠름) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="QuickCopy">
  <defs>
    <linearGradient id="qcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#qcBg)"/>

  <!-- 뒤쪽 카드 -->
  <rect x="140" y="112" width="196" height="252" rx="30" ry="30" fill="#ffffff" opacity="0.45"/>

  <!-- 앞쪽 카드 -->
  <rect x="176" y="148" width="196" height="252" rx="30" ry="30" fill="#ffffff"/>

  <!-- 번개 (앞쪽 카드 중앙) -->
  <path transform="translate(197 190) scale(7)"
        d="M13 2 4.5 13.2h5.6L9 22l8.5-11.2H12L13 2z"
        fill="#4f46e5"/>
</svg>
