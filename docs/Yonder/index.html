<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — 노치 기기에서 화면 전체를 쓰고 safe-area 로 여백을 준다.
      user-scalable=no — 주행 중 의도치 않은 확대를 막는다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>여긴어디</title>
    <meta name="description" content="현재 위치의 행정구역을 알려주는 앱" />

    <!-- ThemeService가 실제 테마에 맞춰 값을 갱신한다. (§9.2) -->
    <meta name="theme-color" content="#0E1116" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA (§8.1). 상대 경로 — GitHub Pages 하위 경로 대응 (§3.3) -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS 홈 화면 (§8.2). iOS는 maskable을 지원하지 않아 별도 아이콘이 필요하다. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="여긴어디" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

    <!--
      첫 페인트 전에 배경색을 확정해 흰 화면 번쩍임을 막는다.
      야간 주행 중 눈부심 방지 목적이라 인라인으로 둔다. (§7.4)
    -->
    <style>
      :root {
        color-scheme: dark light;
      }
      html {
        background: #0e1116;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) {
          background: #f7f9fb;
        }
      }
      html[data-theme='light'] {
        background: #f7f9fb;
      }
    </style>

    <!--
      beforeinstallprompt 는 번들이 파싱되기 전에 발생할 수 있다. 놓치면
      "설치할까요?"를 앱이 직접 띄울 수 없으므로 여기서 먼저 붙잡아 둔다.
      preventDefault() 로 Chrome 기본 배너(뜨다 마는 mini-infobar)도 막는다.
      실제 처리는 src/services/install.js 가 한다.
    -->
    <script>
      window.__yonderInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__yonderInstallEvent = e;
        window.dispatchEvent(new Event('yonder:installavailable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__yonderInstallEvent = null;
      });
    </script>
    <script type="module" crossorigin src="./assets/index-CL-x9OrN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BhcslDke.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <!--
          버전·빌드 번호는 main.js 가 채운다. (src/version.js 가 권위 있는 출처)
          폭이 모자라면 main.js 가 ", Yonder" → "(Build N)" 순으로 조각을 감춘다.
            여긴어디, Yonder v1.2.0 (Build 19)
            여긴어디 v1.2.0 (Build 19)
            여긴어디 v1.2.0
        -->
        <h1 class="topbar__title" data-el="title">
          <span class="topbar__name"
            ><span data-el="app-name-ko">여긴어디</span
            ><span data-el="app-name-en">, Yonder</span></span
          >
          <span class="topbar__meta"
            ><span data-el="app-version"></span
            ><span data-el="app-build"></span></span
          >
        </h1>
        <div class="topbar__actions">
          <!-- 설치할 수 있거나 안내가 필요한 환경에서만 main.js 가 보이게 한다. -->
          <button
            type="button"
            class="button button--accent topbar__install"
            data-el="install-button"
            aria-label="앱 설치"
            title="앱 설치"
            hidden
          >
            <span class="topbar__install-icon" aria-hidden="true">⤓</span>
            <span class="topbar__install-label">앱 설치</span>
          </button>
          <!--
            이력·설정은 상단 아이콘으로 들어간다. 현재위치가 기본 화면이며,
            보조 화면에서 같은 아이콘이나 뒤로가기를 누르면 기본 화면으로 돌아온다.
          -->
          <button
            type="button"
            class="icon-button nav-button"
            data-view="history"
            aria-label="이동 이력"
            title="이동 이력"
            aria-pressed="false"
          >
            <svg class="nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M3 3.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-button nav-button"
            data-view="settings"
            aria-label="설정"
            title="설정"
            aria-pressed="false"
          >
            <svg class="nav-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-button"
            data-el="theme-toggle"
            aria-label="밝게/어둡게 전환"
            title="밝게/어둡게 전환"
          >
            ☾
          </button>
        </div>
      </header>

      <main class="views">
        <section class="view" id="view-main" aria-label="현재 위치"></section>
        <section class="view" id="view-history" aria-label="이동 이력" hidden></section>
        <section class="view" id="view-settings" aria-label="설정" hidden></section>
      </main>
    </div>

  </body>
</html>
