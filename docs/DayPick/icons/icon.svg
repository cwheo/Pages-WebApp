<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <!-- Inner glow for calendar body -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Header gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <!-- Clip path for rounded square -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Outer rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Clipped content group -->
  <g clip-path="url(#roundedClip)">

    <!-- Calendar card body: white card -->
    <rect x="64" y="96" width="384" height="352" rx="24" ry="24" fill="#FFFFFF" filter="url(#shadow)"/>

    <!-- Calendar header strip (dark blue) -->
    <rect x="64" y="96" width="384" height="112" rx="24" ry="24" fill="url(#headerGrad)"/>
    <!-- Cover the bottom-rounded corners of header so it looks flat on bottom -->
    <rect x="64" y="176" width="384" height="32" fill="#0D47A1"/>

    <!-- Calendar ring hooks (left and right) -->
    <rect x="168" y="72" width="28" height="72" rx="14" ry="14" fill="#FFFFFF" opacity="0.9"/>
    <rect x="316" y="72" width="28" height="72" rx="14" ry="14" fill="#FFFFFF" opacity="0.9"/>

    <!-- "DP" label in header -->
    <text
      x="256"
      y="152"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="40"
      font-weight="700"
      fill="#FFFFFF"
      text-anchor="middle"
      letter-spacing="4"
      opacity="0.92">DayPick</text>

    <!-- Large date number "19" centered in card body -->
    <text
      x="256"
      y="360"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="180"
      font-weight="300"
      fill="#1976D2"
      text-anchor="middle"
      opacity="0.95">19</text>

    <!-- Decorative dot row (like calendar grid indicator) -->
    <circle cx="152" cy="418" r="10" fill="#1976D2" opacity="0.20"/>
    <circle cx="192" cy="418" r="10" fill="#1976D2" opacity="0.20"/>
    <circle cx="232" cy="418" r="10" fill="#1976D2" opacity="0.20"/>
    <circle cx="272" cy="418" r="10" fill="#E53935" opacity="0.80"/>
    <circle cx="312" cy="418" r="10" fill="#1976D2" opacity="0.20"/>
    <circle cx="352" cy="418" r="10" fill="#1976D2" opacity="0.20"/>

    <!-- Subtle body gradient overlay -->
    <rect x="64" y="96" width="384" height="352" rx="24" ry="24" fill="url(#bodyGrad)"/>

  </g>
</svg>
