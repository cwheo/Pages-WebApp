<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 시계</title>
<meta name="description" content="여러 도시의 현재 시각을 아날로그·디지털 시계로 한눈에 보여주는 세계 시계">
<meta name="theme-color" content="#161e3a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세계 시계">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f6f7fb;
    --text: #151a2d;
    --muted: #6a7089;
    --line: #e2e5ee;
    --primary: #2e408c;
    --primary-text: #ffffff;
    --accent: #ff6a3d;
    --danger: #d9434b;
    --shadow: 0 1px 2px rgba(21, 26, 45, .05), 0 8px 24px rgba(21, 26, 45, .06);

    /* 시계 문자판 (낮) */
    --face-day: #ffffff;
    --face-day-ring: #dfe3ee;
    --ink-day: #1a2140;
    --tick-day: #aab1c7;
    /* 시계 문자판 (밤) */
    --face-night: #1b2340;
    --face-night-ring: #2c3760;
    --ink-night: #eef1fa;
    --tick-night: #5d6a98;

    --radius: 20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d111c;
      --surface: #151b2b;
      --surface-2: #1b2235;
      --text: #eef1f8;
      --muted: #939ab3;
      --line: #252d44;
      --primary: #6f86ff;
      --primary-text: #0d111c;
      --danger: #ff6b72;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
      --face-day: #f4f6fb;
      --face-day-ring: #3a4466;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; }

  /* ---------- 헤더 ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .brand h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.02em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  /* 버전 배지 - 값은 APP_VERSION 에서 채운다 (단일 출처) */
  .brand .ver {
    display: inline-block; vertical-align: middle; margin-left: 6px;
    padding: 1px 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
    font-size: 11.5px; font-weight: 700; line-height: 1.5; letter-spacing: 0;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .brand .ver:empty { display: none; }

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .seg {
    display: inline-flex; padding: 3px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .seg button {
    border: 0; background: transparent; padding: 7px 12px; border-radius: 999px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface);
    padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn svg { width: 16px; height: 16px; }
  .count { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }

  /* ---------- 카드 그리드 ---------- */
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    position: relative;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 20px 18px;
    display: flex; flex-direction: column; align-items: center;
  }
  .card.new { animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card-head { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .city { min-width: 0; }
  .city h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .city .sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .remove {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .remove:hover:not(:disabled) { background: var(--surface-2); color: var(--danger); }
  .remove:disabled { opacity: .3; cursor: not-allowed; }
  .remove svg { width: 16px; height: 16px; }

  .analog { width: min(100%, 210px); aspect-ratio: 1; margin: 14px 0 10px; }
  .analog svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .face { fill: var(--face-day); stroke: var(--face-day-ring); stroke-width: 2; transition: fill .6s ease; }
  .tick { stroke: var(--tick-day); stroke-linecap: round; }
  .tick.major { stroke: var(--ink-day); }
  .num { fill: var(--ink-day); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .hand { stroke: var(--ink-day); stroke-linecap: round; }
  .hand.sec { stroke: var(--accent); }
  .pin { fill: var(--accent); }
  .pin-in { fill: var(--face-day); }

  .card.night .face { fill: var(--face-night); stroke: var(--face-night-ring); }
  .card.night .tick { stroke: var(--tick-night); }
  .card.night .tick.major, .card.night .hand { stroke: var(--ink-night); }
  .card.night .hand.sec { stroke: var(--accent); }
  .card.night .num { fill: var(--ink-night); }
  .card.night .pin-in { fill: var(--face-night); }

  .digital {
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .digital .ampm { font-size: 15px; font-weight: 600; color: var(--muted); }
  .digital .sec { font-size: 20px; font-weight: 600; color: var(--muted); }

  .meta {
    margin-top: 12px; width: 100%;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 12px;
  }
  .meta .date { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta .date svg { width: 14px; height: 14px; }
  .meta .diff { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--text);
  }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- 도시 추가 대화상자 ---------- */
  dialog {
    width: min(520px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 48px));
    padding: 0; border: 1px solid var(--line); border-radius: 20px;
    background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(10, 14, 28, .45); backdrop-filter: blur(2px); }
  .dlg-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  .dlg-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dlg-title h3 { margin: 0; font-size: 17px; }
  .search {
    width: 100%; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font: inherit; font-size: 15px; outline: none;
  }
  .search:focus { border-color: var(--primary); }
  .results { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  .results li button {
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 12px; border-radius: 12px;
  }
  .results li button:hover:not(:disabled), .results li button:focus-visible { background: var(--surface-2); outline: none; }
  .results li button:disabled { opacity: .45; cursor: default; }
  .r-name { font-weight: 600; font-size: 15px; }
  .r-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .r-time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; text-align: right; }
  .r-section { font-size: 12px; color: var(--muted); padding: 10px 12px 4px; font-weight: 600; }
  .empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 14px; transition: all .25s ease; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .wrap { padding: 18px 16px 32px; }
    header { margin-bottom: 18px; }
    .actions { width: 100%; }
    .actions .btn.primary { margin-left: auto; }
    #installBtn .label { display: none; }
    #installBtn { padding: 9px 11px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { padding: 14px 12px 12px; }
    .city h2 { font-size: 15px; }
    .analog { margin: 8px 0 6px; }
    .num { display: none; }
    .digital { font-size: 26px; gap: 4px; }
    .digital .sec { font-size: 14px; }
    .digital .ampm { font-size: 12px; }
    .meta { flex-direction: column; align-items: center; gap: 4px; font-size: 12px; padding-top: 8px; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.new { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>세계 시계<span class="ver" id="appVer"></span></h1>
        <p id="localInfo">내 시간대</p>
      </div>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="시간 표시 형식">
        <button type="button" id="fmt24" aria-pressed="true">24시간</button>
        <button type="button" id="fmt12" aria-pressed="false">12시간</button>
      </div>
      <button type="button" class="btn" id="installBtn" aria-label="앱 설치" title="앱 설치" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span class="label">앱 설치</span>
      </button>
      <button type="button" class="btn primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        도시 추가 <span class="count" id="count">0/10</span>
      </button>
    </div>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>도시 목록은 이 브라우저에 저장됩니다 · 설치 후 오프라인에서도 동작합니다</footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div class="dlg-title">
      <h3 id="dlgTitle">도시 추가</h3>
      <button type="button" class="remove" id="dlgClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <input type="search" class="search" id="search" placeholder="도시·국가·시간대 검색 (예: 파리, Tokyo, Asia/)" autocomplete="off">
  </div>
  <ul class="results" id="results"></ul>
</dialog>

<div class="toast" id="toast" role="status"></div>

    ['buenosaires', '부에노스아이레스', 'Buenos Aires', '아르헨티나', 'America/Argentina/Buenos_Aires'],
    ['sydney', '시드니', 'Sydney', '호주', 'Australia/Sydney'],
    ['melbourne', '멜버른', 'Melbourne', '호주', 'Australia/Melbourne'],
    ['brisbane', '브리즈번', 'Brisbane', '호주', 'Australia/Brisbane'],
    ['perth', '퍼스', 'Perth', '호주', 'Australia/Perth'],
    ['auckland', '오클랜드', 'Auckland', '뉴질랜드', 'Pacific/Auckland'],
    ['guam', '괌', 'Guam', '미국령', 'Pacific/Guam'],
    ['utc', 'UTC', 'Coordinated Universal Time', '협정 세계시', 'UTC']
  ];
  var CITIES = CITY_DATA.map(function (r) {
    return { id: r[0], name: r[1], en: r[2], country: r[3], tz: r[4] };
  });
  var CITY_BY_ID = {};
  CITIES.forEach(function (c) { CITY_BY_ID[c.id] = c; });

  // ---------- 저장소 (실패해도 동작하도록 try/catch) ----------
  function load(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 불가 환경 */ }
  }

  // ---------- 시간대 계산 ----------
  var fmtCache = {};
  function isValidTz(tz) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return true; } catch (e) { return false; }
  }
  function formatter(tz) {
    if (!fmtCache[tz]) {
      fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hourCycle: 'h23',
        year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric'
      });
    }
    return fmtCache[tz];
  }
  // 해당 시간대의 UTC 대비 오프셋(ms)
  function tzOffsetMs(tz, now) {
    var base = now - (now % 1000);
    var p = {};
    formatter(tz).formatToParts(new Date(base)).forEach(function (x) { p[x.type] = x.value; });
    var h = +p.hour === 24 ? 0 : +p.hour;
    var wall = Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second);
    return wall - base;
  }
  function localOffsetMs(now) { return -new Date(now).getTimezoneOffset() * 60000; }

  // id -> 도시 정보. 목록에 없는 시간대는 "tz:Area/City" 형식으로 저장
  function resolveCity(id) {
    if (CITY_BY_ID[id]) return CITY_BY_ID[id];
    if (typeof id === 'string' && id.indexOf('tz:') === 0) {
      var tz = id.slice(3);
      if (!isValidTz(tz)) return null;
      var parts = tz.split('/');
      return { id: id, name: parts[parts.length - 1].replace(/_/g, ' '), en: tz, country: parts[0].replace(/_/g, ' '), tz: tz };
    }
    return null;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtOffset(ms) {
    var m = Math.round(ms / 60000), sign = m < 0 ? '−' : '+';
    m = Math.abs(m);
    var h = Math.floor(m / 60), mm = m % 60;
    return 'UTC' + sign + h + (mm ? ':' + pad(mm) : '');
  }
  function fmtDiff(ms) {
    var m = Math.round(ms / 60000);
    if (m === 0) return '내 시간과 같음';
    var sign = m > 0 ? '+' : '−';
    m = Math.abs(m);
    var h = Math.floor(m / 60), mm = m % 60;
    return sign + (h ? h + '시간' : '') + (h && mm ? ' ' : '') + (mm ? mm + '분' : '');
  }
  function timeText(zoned, hour12) {
    var h = zoned.getUTCHours(), m = zoned.getUTCMinutes();
    if (!hour12) return { ampm: '', hm: pad(h) + ':' + pad(m) };
    return { ampm: h < 12 ? '오전' : '오후', hm: (h % 12 || 12) + ':' + pad(m) };
  }

  // ---------- 상태 ----------
  var ids = load(KEY_CITIES, null);
  if (!Array.isArray(ids)) ids = DEFAULT_IDS.slice();
  ids = ids.filter(function (id, i) { return resolveCity(id) && ids.indexOf(id) === i; }).slice(0, MAX);
  if (ids.length < MIN) ids = DEFAULT_IDS.slice();
  var hour12 = load(KEY_HOUR12, false) === true;

  // ---------- DOM ----------
  var grid = document.getElementById('grid');
  var addBtn = document.getElementById('addBtn');
  var countEl = document.getElementById('count');
  var dlg = document.getElementById('dlg');
  var search = document.getElementById('search');
  var results = document.getElementById('results');
  var toastEl = document.getElementById('toast');
  var fmt24 = document.getElementById('fmt24');
  var fmt12 = document.getElementById('fmt12');
  var SVGNS = 'http://www.w3.org/2000/svg';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

  function buildClock() {
    var svg = svgEl('svg', { viewBox: '0 0 200 200', role: 'img' });
    svg.appendChild(svgEl('circle', { 'class': 'face', cx: 100, cy: 100, r: 96 }));
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      svg.appendChild(svgEl('line', {
        'class': 'tick' + (major ? ' major' : ''),
        x1: 100, y1: major ? 10 : 11, x2: 100, y2: major ? 21 : 16,
        'stroke-width': major ? 3 : 1.4,
        transform: 'rotate(' + (i * 6) + ' 100 100)'
      }));
    }
    for (var n = 1; n <= 12; n++) {
      var a = n * Math.PI / 6, r = 68;
      var t = svgEl('text', { 'class': 'num', x: (100 + r * Math.sin(a)).toFixed(2), y: (100 - r * Math.cos(a)).toFixed(2) });
      t.textContent = n;
      svg.appendChild(t);
    }
    var hour = svgEl('line', { 'class': 'hand', x1: 100, y1: 108, x2: 100, y2: 52, 'stroke-width': 6.5 });
    var min = svgEl('line', { 'class': 'hand', x1: 100, y1: 112, x2: 100, y2: 28, 'stroke-width': 4.5 });
    var sec = svgEl('line', { 'class': 'hand sec', x1: 100, y1: 124, x2: 100, y2: 20, 'stroke-width': 2 });
    svg.appendChild(hour); svg.appendChild(min); svg.appendChild(sec);
    svg.appendChild(svgEl('circle', { 'class': 'pin', cx: 100, cy: 100, r: 5.5 }));
    svg.appendChild(svgEl('circle', { 'class': 'pin-in', cx: 100, cy: 100, r: 2 }));
    return { svg: svg, hour: hour, min: min, sec: sec };
  }

  var cards = []; // { city, root, clock, digital..., offset }
  var justAdded = null; // 방금 추가된 도시 id (등장 애니메이션용)

  function render() {
    grid.textContent = '';
    cards = [];
    ids.forEach(function (id) {
      var city = resolveCity(id);
      if (!city) return;
      var root = el('article', 'card' + (id === justAdded ? ' new' : ''));

      var head = el('div', 'card-head');
      var info = el('div', 'city');
      info.appendChild(el('h2', null, city.name));
      var sub = el('div', 'sub', city.country + ' · ');
      var offsetSpan = el('span');
      sub.appendChild(offsetSpan);
      info.appendChild(sub);
      var rm = el('button', 'remove');
      rm.type = 'button';
      rm.innerHTML = ICON_X;
      rm.setAttribute('aria-label', city.name + ' 삭제');
      rm.title = ids.length <= MIN ? '최소 1개 도시는 있어야 합니다' : '삭제';
      rm.disabled = ids.length <= MIN;
      rm.addEventListener('click', function () { removeCity(id); });
      head.appendChild(info); head.appendChild(rm);

      var analog = el('div', 'analog');
      var clock = buildClock();
      analog.appendChild(clock.svg);

      var digital = el('div', 'digital');
      var ampm = el('span', 'ampm'), hm = el('span'), sec = el('span', 'sec');
      digital.appendChild(ampm); digital.appendChild(hm); digital.appendChild(sec);

      var meta = el('div', 'meta');
      var date = el('span', 'date');
      var dateIcon = el('span'); dateIcon.style.display = 'inline-flex';
      var dateText = el('span');
      date.appendChild(dateIcon); date.appendChild(dateText);
      var diff = el('span', 'diff');
      meta.appendChild(date); meta.appendChild(diff);

      root.appendChild(head); root.appendChild(analog); root.appendChild(digital); root.appendChild(meta);
      grid.appendChild(root);

      cards.push({
        city: city, root: root, clock: clock, offsetSpan: offsetSpan,
        ampm: ampm, hm: hm, sec: sec, dateIcon: dateIcon, dateText: dateText, diff: diff,
        offset: 0, night: null
      });
    });
    countEl.textContent = ids.length + '/' + MAX;
    addBtn.disabled = ids.length >= MAX;
    addBtn.title = ids.length >= MAX ? '최대 ' + MAX + '개까지 추가할 수 있습니다' : '';
    lastSecond = -1;
    tick();
  }

  // ---------- 매 초 텍스트 갱신 + 매 프레임 바늘 갱신 ----------
  var lastSecond = -1;
  function updateText(now) {
    var local = localOffsetMs(now);
    var localDay = Math.floor((now + local) / 86400000);
    cards.forEach(function (c) {
      c.offset = tzOffsetMs(c.city.tz, now);
      var zoned = new Date(now + c.offset);
      var t = timeText(zoned, hour12);
      c.ampm.textContent = t.ampm;
      c.ampm.hidden = !t.ampm;
      c.hm.textContent = t.hm;
      c.sec.textContent = pad(zoned.getUTCSeconds());

      var dayDiff = Math.floor((now + c.offset) / 86400000) - localDay;
      var rel = dayDiff === 0 ? '오늘' : dayDiff === 1 ? '내일' : dayDiff === -1 ? '어제' : '';
      c.dateText.innerHTML = '';
      c.dateText.appendChild(document.createTextNode(
        (zoned.getUTCMonth() + 1) + '월 ' + zoned.getUTCDate() + '일 (' + WEEK[zoned.getUTCDay()] + ') '));
      if (rel) c.dateText.appendChild(el('span', 'badge', rel));

      var h = zoned.getUTCHours();
      var night = h < 6 || h >= 18;
      if (night !== c.night) {
        c.night = night;
        c.root.classList.toggle('night', night);
        c.dateIcon.innerHTML = night ? ICON_MOON : ICON_SUN;
        c.dateIcon.title = night ? '밤' : '낮';
      }
      c.offsetSpan.textContent = fmtOffset(c.offset);
      c.diff.textContent = fmtDiff(c.offset - local);
      c.clock.svg.setAttribute('aria-label', c.city.name + ' ' + (hour12 ? t.ampm + ' ' : '') + t.hm);
    });
  }
  function updateHands(now) {
    cards.forEach(function (c) {
      var zoned = new Date(now + c.offset);
      var s = zoned.getUTCSeconds() + zoned.getUTCMilliseconds() / 1000;
      var m = zoned.getUTCMinutes() + s / 60;
      var h = (zoned.getUTCHours() % 12) + m / 60;
      c.clock.sec.setAttribute('transform', 'rotate(' + (s * 6).toFixed(2) + ' 100 100)');
      c.clock.min.setAttribute('transform', 'rotate(' + (m * 6).toFixed(2) + ' 100 100)');
      c.clock.hour.setAttribute('transform', 'rotate(' + (h * 30).toFixed(2) + ' 100 100)');
    });
  }
  function tick() {
    var now = Date.now();
    var sec = Math.floor(now / 1000);
    if (sec !== lastSecond) { lastSecond = sec; updateText(now); }
    updateHands(now);
  }
  (function loop() { tick(); requestAnimationFrame(loop); })();
  // 탭이 백그라운드였다가 돌아오면 즉시 다시 계산
  document.addEventListener('visibilitychange', function () { lastSecond = -1; tick(); });

  // ---------- 추가 / 삭제 ----------
  function addCity(id) {
    if (ids.indexOf(id) !== -1) return;
    if (ids.length >= MAX) { toast('최대 ' + MAX + '개까지 추가할 수 있습니다'); return; }
    ids.push(id);
    save(KEY_CITIES, ids);
    justAdded = id;
    render();
    justAdded = null;
    toast(resolveCity(id).name + ' 추가됨');
  }
  function removeCity(id) {
    if (ids.length <= MIN) { toast('최소 1개 도시는 있어야 합니다'); return; }
    var city = resolveCity(id);
    ids = ids.filter(function (x) { return x !== id; });
    save(KEY_CITIES, ids);
    render();
    toast(city.name + ' 삭제됨');
  }

  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  // ---------- 12/24 시간 ----------
  function setHour12(v) {
    hour12 = v;
    save(KEY_HOUR12, v);
    fmt12.setAttribute('aria-pressed', String(v));
    fmt24.setAttribute('aria-pressed', String(!v));
    lastSecond = -1;
    tick();
  }
  fmt24.addEventListener('click', function () { setHour12(false); });
  fmt12.addEventListener('click', function () { setHour12(true); });

  // ---------- 도시 검색 대화상자 ----------
  var ALL_TZ = [];
  try { if (Intl.supportedValuesOf) ALL_TZ = Intl.supportedValuesOf('timeZone'); } catch (e) { /* 미지원 브라우저 */ }

  function norm(s) { return String(s).toLowerCase().replace(/[\s_.,\-]/g, ''); }

  function resultItem(city) {
    var li = el('li');
    var b = el('button');
    b.type = 'button';
    var added = ids.indexOf(city.id) !== -1;
    b.disabled = added;
    var left = el('div');
    left.appendChild(el('div', 'r-name', city.name));
    left.appendChild(el('div', 'r-sub', (city.en !== city.name ? city.en + ' · ' : '') + city.country));
    var now = Date.now(), off = 0;
    try { off = tzOffsetMs(city.tz, now); } catch (e) { return null; }
    var t = timeText(new Date(now + off), hour12);
    var right = el('div', 'r-time', added ? '추가됨' : (t.ampm ? t.ampm + ' ' : '') + t.hm);
    right.appendChild(el('div', 'r-sub', fmtOffset(off)));
    b.appendChild(left); b.appendChild(right);
    b.addEventListener('click', function () { addCity(city.id); dlg.close(); });
    li.appendChild(b);
    return li;
  }

  function renderResults() {
    var q = norm(search.value.trim());
    results.textContent = '';
    var list = CITIES.filter(function (c) {
      return !q || norm(c.name).indexOf(q) !== -1 || norm(c.en).indexOf(q) !== -1 ||
        norm(c.country).indexOf(q) !== -1 || norm(c.tz).indexOf(q) !== -1;
    });
    list.forEach(function (c) { var li = resultItem(c); if (li) results.appendChild(li); });

    // 목록에 없는 도시는 IANA 시간대 이름으로 검색
    if (q.length >= 2 && ALL_TZ.length) {
      var known = {};
      CITIES.forEach(function (c) { known[c.tz] = true; });
      var extra = ALL_TZ.filter(function (tz) { return !known[tz] && norm(tz).indexOf(q) !== -1; }).slice(0, 30);
      if (extra.length) {
        results.appendChild(el('li', 'r-section', '기타 시간대'));
        extra.forEach(function (tz) { var li = resultItem(resolveCity('tz:' + tz)); if (li) results.appendChild(li); });
      }
    }
    if (!results.children.length) results.appendChild(el('li', 'empty', '검색 결과가 없습니다'));
  }

  addBtn.addEventListener('click', function () {
    if (ids.length >= MAX) { toast('최대 ' + MAX + '개까지 추가할 수 있습니다'); return; }
    search.value = '';
    renderResults();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    setTimeout(function () { search.focus(); }, 30);
  });
  document.getElementById('dlgClose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); }); // 바깥 클릭 시 닫기
  search.addEventListener('input', renderResults);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = results.querySelector('button:not(:disabled)');
      if (first) first.click();
    }
  });

  // ---------- 내 시간대 표시 ----------
  (function () {
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* ignore */ }
    document.getElementById('localInfo').textContent =
      '내 시간대 · ' + (tz ? tz + ' ' : '') + '(' + fmtOffset(localOffsetMs(Date.now())) + ')';
  })();

  // ---------- 설치 (PWA) ----------
  var installBtn = document.getElementById('installBtn');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; toast('설치되었습니다'); });

  // 서비스 워커: http(s) 에서만 동작 (file:// 로 열면 건너뜀)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 오프라인 캐시 미사용 */ });
    });
  }

  document.getElementById('appVer').textContent = 'v' + APP_VERSION;   // 헤더 버전 배지
  fmt12.setAttribute('aria-pressed', String(hour12));
  fmt24.setAttribute('aria-pressed', String(!hour12));
  render();
})();
</script>
</body>
</html>
