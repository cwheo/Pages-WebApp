<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 시계</title>
<meta name="description" content="여러 도시의 현재 시각을 아날로그·디지털 시계로 한눈에 보여주는 세계 시계">
<meta name="author" content="허창원 (Changwon Heo)">
<meta name="theme-color" content="#161e3a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세계 시계">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f6f7fb;
    --text: #151a2d;
    --muted: #6a7089;
    --line: #e2e5ee;
    --primary: #2e408c;
    --primary-text: #ffffff;
    --accent: #ff6a3d;
    --danger: #d9434b;
    --shadow: 0 1px 2px rgba(21, 26, 45, .05), 0 8px 24px rgba(21, 26, 45, .06);

    /* 시계 문자판 (낮) */
    --face-day: #ffffff;
    --face-day-ring: #dfe3ee;
    --ink-day: #1a2140;
    --tick-day: #aab1c7;
    /* 시계 문자판 (밤) */
    --face-night: #1b2340;
    --face-night-ring: #2c3760;
    --ink-night: #eef1fa;
    --tick-night: #5d6a98;

    --radius: 20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d111c;
      --surface: #151b2b;
      --surface-2: #1b2235;
      --text: #eef1f8;
      --muted: #939ab3;
      --line: #252d44;
      --primary: #6f86ff;
      --primary-text: #0d111c;
      --danger: #ff6b72;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
      --face-day: #f4f6fb;
      --face-day-ring: #3a4466;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }   /* .btn 등 display 지정 요소도 hidden 속성으로 숨김 */

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; }

  /* ---------- 헤더 ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .brand h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.02em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  /* 버전 배지 - 값은 APP_VERSION 에서 채운다 (단일 출처), 누르면 앱 정보 창 */
  .brand .ver {
    display: inline-block; vertical-align: middle; margin-left: 6px;
    padding: 1px 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: 11.5px; font-weight: 700; line-height: 1.5; letter-spacing: 0;
    white-space: nowrap; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .brand .ver:hover, .brand .ver:focus-visible { color: var(--text); border-color: var(--primary); outline: none; }
  .brand .ver svg { width: 12px; height: 12px; margin-left: 3px; vertical-align: -1.5px; }   /* ⓘ - 누를 수 있다는 표시 */

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .seg {
    display: inline-flex; padding: 3px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .seg button {
    border: 0; background: transparent; padding: 7px 12px; border-radius: 999px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface);
    padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn svg { width: 16px; height: 16px; }
  .count { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }

  /* ---------- 카드 그리드 ---------- */
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    position: relative;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 20px 18px;
    display: flex; flex-direction: column; align-items: center;
  }
  .card.new { animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card-head { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .city { min-width: 0; }
  .city h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .city .sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .remove {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .remove:hover:not(:disabled) { background: var(--surface-2); color: var(--danger); }
  .remove:disabled { opacity: .3; cursor: not-allowed; }
  .remove svg { width: 16px; height: 16px; }

  .analog { width: min(100%, 210px); aspect-ratio: 1; margin: 14px 0 10px; }
  .analog svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .face { fill: var(--face-day); stroke: var(--face-day-ring); stroke-width: 2; transition: fill .6s ease; }
  .tick { stroke: var(--tick-day); stroke-linecap: round; }
  .tick.major { stroke: var(--ink-day); }
  .num { fill: var(--ink-day); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .hand { stroke: var(--ink-day); stroke-linecap: round; }
  .hand.sec { stroke: var(--accent); }
  .pin { fill: var(--accent); }
  .pin-in { fill: var(--face-day); }

  .card.night .face { fill: var(--face-night); stroke: var(--face-night-ring); }
  .card.night .tick { stroke: var(--tick-night); }
  .card.night .tick.major, .card.night .hand { stroke: var(--ink-night); }
  .card.night .hand.sec { stroke: var(--accent); }
  .card.night .num { fill: var(--ink-night); }
  .card.night .pin-in { fill: var(--face-night); }

  .digital {
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .digital .ampm { font-size: 15px; font-weight: 600; color: var(--muted); }
  .digital .sec { font-size: 20px; font-weight: 600; color: var(--muted); }

  .meta {
    margin-top: 12px; width: 100%;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 12px;
  }
  .meta .date { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta .date svg { width: 14px; height: 14px; }
  .meta .diff { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--text);
  }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- 도시 추가 대화상자 ---------- */
  dialog {
    width: min(520px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 48px));
    padding: 0; border: 1px solid var(--line); border-radius: 20px;
    background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(10, 14, 28, .45); backdrop-filter: blur(2px); }
  .dlg-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  .dlg-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dlg-title h3 { margin: 0; font-size: 17px; }
  .search {
    width: 100%; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font: inherit; font-size: 15px; outline: none;
  }
  .search:focus { border-color: var(--primary); }
  .results { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  .results li button {
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 12px; border-radius: 12px;
  }
  .results li button:hover:not(:disabled), .results li button:focus-visible { background: var(--surface-2); outline: none; }
  .results li button:disabled { opacity: .45; cursor: default; }
  .r-name { font-weight: 600; font-size: 15px; }
  .r-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .r-time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; text-align: right; }
  .r-section { font-size: 12px; color: var(--muted); padding: 10px 12px 4px; font-weight: 600; }
  .empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- 설치 안내 대화상자 ---------- */
  dialog.guide { width: min(420px, calc(100vw - 32px)); }
  .guide-body { padding: 20px 20px 6px; overflow-y: auto; }
  .guide-body h3 { margin: 0 0 12px; font-size: 17px; }
  .guide-body p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.55; }
  .guide-url {
    font-size: 13px; padding: 8px 10px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    word-break: break-all; -webkit-user-select: all; user-select: all;
  }
  .steps { list-style: none; margin: 4px 0 10px; padding: 0; display: grid; gap: 10px; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; }
  .steps .no {
    flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--primary); color: var(--primary-text); font-size: 12px; font-weight: 700;
  }
  .ico { width: 17px; height: 17px; vertical-align: -3px; }
  .guide-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 8px; padding: 12px 20px 18px; }
  .guide-mute {
    margin-right: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .guide-mute input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
  .guide-btns { display: flex; gap: 8px; margin-left: auto; }   /* 좁으면 버튼 묶음째 다음 줄로 */

  /* ---------- 앱 정보 대화상자 (설치 안내 창 스타일 재사용) ---------- */
  dialog.about { width: min(360px, calc(100vw - 32px)); }
  .about-info { margin: 4px 0 6px; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14.5px; }
  .about-info dt { color: var(--muted); }
  .about-info dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
  .about-mail { -webkit-user-select: all; user-select: all; }   /* 한 번에 선택해 복사 */
  /* 업데이트 확인 결과 - 모달 위에 뜨는 창이라 토스트 대신 창 안에 표시 */
  .about-status {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--bg); border-left: 4px solid var(--primary);
    font-size: 14.5px; font-weight: 600; line-height: 1.45;
  }
  .about-status.error { border-left-color: var(--danger); color: var(--danger); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 14px; transition: all .25s ease; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .wrap { padding: 18px 16px 32px; }
    header { margin-bottom: 18px; }
    .actions { width: 100%; }
    .actions .btn.primary { margin-left: auto; }
    #installBtn .label { display: none; }
    #installBtn { padding: 9px 11px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { padding: 14px 12px 12px; }
    .city h2 { font-size: 15px; }
    .analog { margin: 8px 0 6px; }
    .num { display: none; }
    .digital { font-size: 26px; gap: 4px; }
    .digital .sec { font-size: 14px; }
    .digital .ampm { font-size: 12px; }
    .meta { flex-direction: column; align-items: center; gap: 4px; font-size: 12px; padding-top: 8px; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.new { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>세계 시계<button type="button" class="ver" id="appVer" aria-label="앱 정보" title="앱 정보"><span id="appVerText"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg></button></h1>
        <p id="localInfo">내 시간대</p>
      </div>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="시간 표시 형식">
        <button type="button" id="fmt24" aria-pressed="true">24시간</button>
        <button type="button" id="fmt12" aria-pressed="false">12시간</button>
      </div>
      <button type="button" class="btn" id="installBtn" aria-label="앱 설치" title="앱 설치" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span class="label">앱 설치</span>
      </button>
      <button type="button" class="btn primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        도시 추가 <span class="count" id="count">0/10</span>
      </button>
    </div>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>도시 목록은 이 브라우저에 저장됩니다 · 설치 후 오프라인에서도 동작합니다</footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div class="dlg-title">
      <h3 id="dlgTitle">도시 추가</h3>
      <button type="button" class="remove" id="dlgClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <input type="search" class="search" id="search" placeholder="도시·국가·시간대 검색 (예: 파리, Tokyo, Asia/)" autocomplete="off">
  </div>
  <ul class="results" id="results"></ul>
</dialog>

<dialog id="guide" class="guide" aria-labelledby="guideTitle">
  <div class="guide-body">
    <h3 id="guideTitle"></h3>
    <div id="guideText"></div>
  </div>
  <div class="guide-actions">
    <label class="guide-mute"><input type="checkbox" id="guideMute"> 다시 보지 않기</label>
    <div class="guide-btns">
      <button type="button" class="btn" id="guideCancel"></button>
      <button type="button" class="btn primary" id="guideOk"></button>
    </div>
  </div>
</dialog>

<dialog id="about" class="guide about" aria-label="앱 정보">
  <div class="guide-body">
    <h3 id="aboutTitle"></h3>
    <dl class="about-info">
      <dt>만든 사람</dt><dd>허창원</dd>
      <dt>연락처</dt><dd class="about-mail" id="aboutMail"></dd>
    </dl>
    <p class="about-status" id="aboutStatus" role="status" hidden></p>
  </div>
  <div class="guide-actions">
    <div class="guide-btns">
      <button type="button" class="btn" id="aboutUpdate">업데이트 확인</button>
      <button type="button" class="btn primary" id="aboutClose">닫기</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>

  'use strict';

  // 앱 버전 - 09_ChangeVersionName.py 로 sw.js CACHE 와 함께 변경한다

  var CITIES = CITY_DATA.map(function (r) {

  var CITY_BY_ID = {};

  // ---------- 저장소 (실패해도 동작하도록 try/catch) ----------
  function load(key, fallback) {
    try {

      return v == null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  }
  function save(key, value) {

  // ---------- 시간대 계산 ----------
  var fmtCache = {};
  function isValidTz(tz) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return true; } catch (e) { return false; }
  }
  function formatter(tz) {
    if (!fmtCache[tz]) {
      fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hourCycle: 'h23',
        year: 'numeric', month: 'numeric', day: 'numeric',

  function tzOffsetMs(tz, now) {

    formatter(tz).formatToParts(new Date(base)).forEach(function (x) { p[x.type] = x.value; });
    var h = +p.hour === 24 ? 0 : +p.hour;
    var wall = Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second);
    return wall - base;

  // id -> 도시 정보. 목록에 없는 시간대는 "tz:Area/City" 형식으로 저장
  function resolveCity(id) {
    if (CITY_BY_ID[id]) return CITY_BY_ID[id];
    if (typeof id === 'string' && id.indexOf('tz:') === 0) {
      var tz = id.slice(3);
      if (!isValidTz(tz)) return null;
      var parts = tz.split('/');
      return { id: id, name: parts[parts.length - 1].replace(/_/g, ' '), en: tz, country: parts[0].replace(/_/g, ' '), tz: tz };
    }

  }

    var h = Math.floor(m / 60), mm = m % 60;

  // ---------- DOM ----------

  var dlg = document.getElementById('dlg');

  var toastEl = document.getElementById('toast');

  var fmt12 = document.getElementById('fmt12');
  var SVGNS = 'http://www.w3.org/2000/svg';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);

  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

  function buildClock() {
    var svg = svgEl('svg', { viewBox: '0 0 200 200', role: 'img' });
    svg.appendChild(svgEl('circle', { 'class': 'face', cx: 100, cy: 100, r: 96 }));
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      svg.appendChild(svgEl('line', {
        'class': 'tick' + (major ? ' major' : ''),
        x1: 100, y1: major ? 10 : 11, x2: 100, y2: major ? 21 : 16,
        'stroke-width': major ? 3 : 1.4,
        transform: 'rotate(' + (i * 6) + ' 100 100)'
      }));
    }
    for (var n = 1; n <= 12; n++) {
      var a = n * Math.PI / 6, r = 68;
      var t = svgEl('text', { 'class': 'num', x: (100 + r * Math.sin(a)).toFixed(2), y: (100 - r * Math.cos(a)).toFixed(2) });
      t.textContent = n;
      svg.appendChild(t);
    }
    var hour = svgEl('line', { 'class': 'hand', x1: 100, y1: 108, x2: 100, y2: 52, 'stroke-width': 6.5 });
    var min = svgEl('line', { 'class': 'hand', x1: 100, y1: 112, x2: 100, y2: 28, 'stroke-width': 4.5 });
    var sec = svgEl('line', { 'class': 'hand sec', x1: 100, y1: 124, x2: 100, y2: 20, 'stroke-width': 2 });
    svg.appendChild(hour); svg.appendChild(min); svg.appendChild(sec);
    svg.appendChild(svgEl('circle', { 'class': 'pin', cx: 100, cy: 100, r: 5.5 }));
    svg.appendChild(svgEl('circle', { 'class': 'pin-in', cx: 100, cy: 100, r: 2 }));
    return { svg: svg, hour: hour, min: min, sec: sec };
  }

  var justAdded = null; // 방금 추가된 도시 id (등장 애니메이션용)

  function render() {
    grid.textContent = '';
    cards = [];
    ids.forEach(function (id) {
      var city = resolveCity(id);
      if (!city) return;
      var root = el('article', 'card' + (id === justAdded ? ' new' : ''));

      var head = el('div', 'card-head');
      var info = el('div', 'city');
      info.appendChild(el('h2', null, city.name));
      var sub = el('div', 'sub', city.country + ' · ');
      var offsetSpan = el('span');
      sub.appendChild(offsetSpan);
      info.appendChild(sub);
      var rm = el('button', 'remove');
      rm.type = 'button';
      rm.innerHTML = ICON_X;

      rm.title = ids.length <= MIN ? '최소 1개 도시는 있어야 합니다' : '삭제';
      rm.disabled = ids.length <= MIN;
      rm.addEventListener('click', function () { removeCity(id); });
      head.appendChild(info); head.appendChild(rm);

      var analog = el('div', 'analog');
      var clock = buildClock();
      analog.appendChild(clock.svg);

      var digital = el('div', 'digital');
      var ampm = el('span', 'ampm'), hm = el('span'), sec = el('span', 'sec');
      digital.appendChild(ampm); digital.appendChild(hm); digital.appendChild(sec);

      var meta = el('div', 'meta');
      var date = el('span', 'date');
      var dateIcon = el('span'); dateIcon.style.display = 'inline-flex';
      var dateText = el('span');
      date.appendChild(dateIcon); date.appendChild(dateText);
      var diff = el('span', 'diff');
      meta.appendChild(date); meta.appendChild(diff);

      root.appendChild(head); root.appendChild(analog); root.appendChild(digital); root.appendChild(meta);
      grid.appendChild(root);

      cards.push({
        city: city, root: root, clock: clock, offsetSpan: offsetSpan,
        ampm: ampm, hm: hm, sec: sec, dateIcon: dateIcon, dateText: dateText, diff: diff,
        offset: 0, night: null

  // ---------- 매 초 텍스트 갱신 + 매 프레임 바늘 갱신 ----------
  var lastSecond = -1;
  function updateText(now) {
    var local = localOffsetMs(now);
    var localDay = Math.floor((now + local) / 86400000);
    cards.forEach(function (c) {
      c.offset = tzOffsetMs(c.city.tz, now);
      var zoned = new Date(now + c.offset);
      var t = timeText(zoned, hour12);
      c.ampm.textContent = t.ampm;
      c.ampm.hidden = !t.ampm;
      c.hm.textContent = t.hm;
      c.sec.textContent = pad(zoned.getUTCSeconds());

      var dayDiff = Math.floor((now + c.offset) / 86400000) - localDay;
      var rel = dayDiff === 0 ? '오늘' : dayDiff === 1 ? '내일' : dayDiff === -1 ? '어제' : '';
      c.dateText.innerHTML = '';
      c.dateText.appendChild(document.createTextNode(
        (zoned.getUTCMonth() + 1) + '월 ' + zoned.getUTCDate() + '일 (' + WEEK[zoned.getUTCDay()] + ') '));
      if (rel) c.dateText.appendChild(el('span', 'badge', rel));

      var h = zoned.getUTCHours();
      var night = h < 6 || h >= 18;
      if (night !== c.night) {
        c.night = night;
        c.root.classList.toggle('night', night);
        c.dateIcon.innerHTML = night ? ICON_MOON : ICON_SUN;
        c.dateIcon.title = night ? '밤' : '낮';

      c.offsetSpan.textContent = fmtOffset(c.offset);
      c.diff.textContent = fmtDiff(c.offset - local);

      var m = zoned.getUTCMinutes() + s / 60;
      var h = (zoned.getUTCHours() % 12) + m / 60;
      c.clock.sec.setAttribute('transform', 'rotate(' + (s * 6).toFixed(2) + ' 100 100)');
      c.clock.min.setAttribute('transform', 'rotate(' + (m * 6).toFixed(2) + ' 100 100)');
      c.clock.hour.setAttribute('transform', 'rotate(' + (h * 30).toFixed(2) + ' 100 100)');
    });
  }
  function tick() {
    var now = Date.now();
    var sec = Math.floor(now / 1000);

  function addCity(id) {

    ids.push(id);

    save(KEY_CITIES, ids);
    render();
    toast(city.name + ' 삭제됨');

  var ALL_TZ = [];

  function norm(s) { return String(s).toLowerCase().replace(/[\s_.,\-]/g, ''); }

  function resultItem(city) {
    var li = el('li');
    var b = el('button');
    b.type = 'button';
    var added = ids.indexOf(city.id) !== -1;
    b.disabled = added;
    var left = el('div');
    left.appendChild(el('div', 'r-name', city.name));
    left.appendChild(el('div', 'r-sub', (city.en !== city.name ? city.en + ' · ' : '') + city.country));
    var now = Date.now(), off = 0;
    try { off = tzOffsetMs(city.tz, now); } catch (e) { return null; }
    var t = timeText(new Date(now + off), hour12);
    var right = el('div', 'r-time', added ? '추가됨' : (t.ampm ? t.ampm + ' ' : '') + t.hm);
    right.appendChild(el('div', 'r-sub', fmtOffset(off)));
    b.appendChild(left); b.appendChild(right);
    b.addEventListener('click', function () { addCity(city.id); dlg.close(); });
    li.appendChild(b);
    return li;
  }

  function renderResults() {
    var q = norm(search.value.trim());
    results.textContent = '';
    var list = CITIES.filter(function (c) {
      return !q || norm(c.name).indexOf(q) !== -1 || norm(c.en).indexOf(q) !== -1 ||
        norm(c.country).indexOf(q) !== -1 || norm(c.tz).indexOf(q) !== -1;
    });
    list.forEach(function (c) { var li = resultItem(c); if (li) results.appendChild(li); });

    // 목록에 없는 도시는 IANA 시간대 이름으로 검색
    if (q.length >= 2 && ALL_TZ.length) {
      var known = {};
      CITIES.forEach(function (c) { known[c.tz] = true; });
      var extra = ALL_TZ.filter(function (tz) { return !known[tz] && norm(tz).indexOf(q) !== -1; }).slice(0, 30);
      if (extra.length) {
        results.appendChild(el('li', 'r-section', '기타 시간대'));
        extra.forEach(function (tz) { var li = resultItem(resolveCity('tz:' + tz)); if (li) results.appendChild(li); });
      }
    }
    if (!results.children.length) results.appendChild(el('li', 'empty', '검색 결과가 없습니다'));
  }

  addBtn.addEventListener('click', function () {
    if (ids.length >= MAX) { toast('최대 ' + MAX + '개까지 추가할 수 있습니다'); return; }

    }
  });

  // ---------- 내 시간대 표시 ----------
  (function () {
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* ignore */ }
    document.getElementById('localInfo').textContent =
      '내 시간대 · ' + (tz ? tz + ' ' : '') + '(' + fmtOffset(localOffsetMs(Date.now())) + ')';
  })();

  // ---------- 설치 (PWA) · 실행 환경 안내 ----------
  // 목표는 홈 화면에 설치해 오프라인으로 쓰는 것이며, 플랫폼마다 설치 경로가 다르다.
  //   Android : 설치를 제대로 지원하는 것은 Chrome. Chrome 이 아니면(카카오톡 등 인앱 웹뷰,
  //             삼성 인터넷 등) 실행할 때마다 Chrome 으로 열지 묻는다. Chrome 이 없는 기기로
  //             확인되면 더 묻지 않는다. Chrome 에서는 설치 가능해지면 설치 창을 묻는다.
  //   iOS     : 설치 창을 띄울 API 가 없어 공유 → '홈 화면에 추가' 절차를 안내한다.
  //             Safari 와 iOS 16.4+ 의 Chrome·Edge 등은 추가 가능, 인앱 웹뷰는 불가 → Safari 로 유도.
  // 이미 홈 화면 앱으로 실행 중이거나 file:// 로 열었으면 아무것도 묻지 않는다.
  // UA 판별은 취약하지만 인앱 웹뷰를 알아낼 표준 API 가 없다. 오탐이어도 안내 창이 뜨는 정도다.
  var KEY_NOCHROME = 'worldclock.nochrome.v1';
  var KEY_GUIDE_OFF = 'worldclock.guideoff.v1';   // '다시 보지 않기' 한 안내 종류 { chrome: true, ... }
  var NO_CHROME_MARK = 'wcnochrome';   // intent fallback 주소 표식 (Chrome 미설치 감지)
  var GUIDE_DELAY_MS = 800;            // 시계가 먼저 그려지도록 살짝 늦게 띄운다

  var IN_APP = [
    { re: /KAKAOTALK/i, label: '카카오톡', kakao: true },
    { re: /NAVER\(inapp/i, label: '네이버 앱' },
    { re: /\bLine\//i, label: '라인' },
    { re: /\b(FBAN|FBAV|FB_IAB)\b/i, label: '페이스북' },
    { re: /Instagram/i, label: '인스타그램' },
    { re: /DaumApps|DaumDevice/i, label: '다음 앱' },
    { re: /\bBAND\//i, label: '밴드' },
    { re: /;\s*wv\)/i, label: '다른 앱' }   // Android 웹뷰 표식 (진짜 Chrome 에는 없음)
  ];
  // Chrome 계열이지만 Chrome 이 아닌 브라우저
  var OTHER_BROWSERS = [
    { re: /SamsungBrowser/i, label: '삼성 인터넷' },
    { re: /Whale/i, label: '웨일' },
    { re: /\b(EdgA|EdgiOS|Edg)\b/i, label: 'Edge' },
    { re: /\b(OPR|OPT|OPiOS)\b/i, label: 'Opera' },
    { re: /\b(FxiOS|Firefox)\b/i, label: 'Firefox' },
    { re: /DuckDuckGo/i, label: 'DuckDuckGo' },
    { re: /Brave/i, label: 'Brave' },
    { re: /UCBrowser/i, label: 'UC 브라우저' },
    { re: /MiuiBrowser/i, label: 'Mi 브라우저' },
    { re: /HeyTapBrowser/i, label: 'HeyTap 브라우저' }
  ];

  function findUa(list, ua) {
    for (var i = 0; i < list.length; i++) if (list[i].re.test(ua)) return list[i];
    return null;
  }
  function detectStandalone() {
    try {
      if (matchMedia('(display-mode: standalone)').matches ||
          matchMedia('(display-mode: fullscreen)').matches ||
          matchMedia('(display-mode: minimal-ui)').matches) return true;
    } catch (e) { /* matchMedia 미지원 */ }
    return navigator.standalone === true;   // iOS Safari 비표준
  }
  function detectEnv() {
    var ua = navigator.userAgent || '';
    var inApp = findUa(IN_APP, ua);
    var other = findUa(OTHER_BROWSERS, ua);
    // iPadOS 13+ 는 데스크톱 Safari 로 위장하므로 터치 지원으로 가른다
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var isChrome = /Chrome\/|CriOS\//i.test(ua) && !inApp && !other;
    // iOS 버전 (예: 'OS 16_4' → 1604). 데스크톱 위장 UA 는 버전이 없어 최신으로 간주
    var m = ua.match(/OS (\d+)_(\d+)/);
    var iosVer = !isIOS ? 0 : (m ? (+m[1]) * 100 + (+m[2]) : 9999);
    var label = inApp ? inApp.label : other ? other.label : isChrome ? 'Chrome' : isIOS ? 'Safari' : '이 브라우저';
    return {
      isAndroid: /Android/i.test(ua),
      isIOS: isIOS,
      iosVer: iosVer,
      standalone: detectStandalone(),
      inApp: inApp,
      isChrome: isChrome,
      iosSafari: isIOS && !inApp && !isChrome && !other,
      label: label
    };
  }
  var env = detectEnv();
  var webOk = /^https?:$/.test(location.protocol);

  // intent fallback 으로 되돌아왔으면(= Chrome 미설치) 기록하고 주소에서 표식을 지운다
  (function () {
    try {
      var params = new URLSearchParams(location.search);
      if (!params.has(NO_CHROME_MARK)) return;
      save(KEY_NOCHROME, true);
      params.delete(NO_CHROME_MARK);
      var q = params.toString();
      history.replaceState(history.state, '', location.pathname + (q ? '?' + q : '') + location.hash);
    } catch (e) { /* 무시 */ }
  })();

  /** 이번 실행에서 보여줄 안내 종류. null 이면 안내 없음 */
  function guideKind() {
    if (!webOk || env.standalone) return null;
    if (env.isIOS) {
      if (env.inApp) return 'iosSafari';                          // 인앱 웹뷰는 추가 불가
      if (env.iosSafari || env.iosVer >= 1604) return 'iosAddHome';
      return 'iosSafari';                                         // 16.4 미만 타 브라우저
    }
    if (env.isAndroid && !env.isChrome && !load(KEY_NOCHROME, false)) return 'chrome';
    return null;   // Android Chrome · 데스크톱은 beforeinstallprompt 를 기다린다
  }

  function appUrl() { return location.origin + location.pathname; }

  /** 같은 주소를 Chrome 으로 연다 (Android). Chrome 이 없으면 표식 달린 fallback 주소가 현재 브라우저에 열린다 */
  function openInChrome() {
    var url = appUrl();
    var fallback = url + '?' + NO_CHROME_MARK + '=1';
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
      '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent(fallback) + ';end';
    // 카카오톡은 intent 를 막는 버전이 있다 — 화면이 그대로면 외부 브라우저로 한 번 더 시도
    if (env.inApp && env.inApp.kakao) {
      setTimeout(function () {
        if (!document.hidden) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
      }, 1200);
    }
  }

  function copyUrl() {
    var url = appUrl();
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, url.length);   // iOS 는 이것까지 해야 선택된다
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(url).then(function () { return true; }, legacy);
    }
    return Promise.resolve(legacy());
  }

  function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  var ICON_SHARE ='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  var ICON_ADD = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';

  var guide = document.getElementById('guide');
  var guideTitle = document.getElementById('guideTitle');
  var guideText = document.getElementById('guideText');
  var guideOk = document.getElementById('guideOk');
  var guideCancel = document.getElementById('guideCancel');
  var guideMute = document.getElementById('guideMute');
  var guideOnOk = null;
  var guideKindShown = null;

  // 기기(브라우저)마다 저장소가 따로라서, 이미 설치한 뒤 카카오톡 · Safari 로 다시 열면
  // 설치 여부를 알 수 없다. 그런 경우 반복 안내를 끄도록 안내 종류별로 기억한다.
  // 헤더 '앱 설치' 버튼으로는 계속 열 수 있고, 거기서 체크를 풀면 자동 안내가 다시 켜진다.
  function isGuideOff(kind) { return !!load(KEY_GUIDE_OFF, {})[kind]; }
  function setGuideOff(kind, off) {
    var map = load(KEY_GUIDE_OFF, {});
    if (off) map[kind] = true; else delete map[kind];
    save(KEY_GUIDE_OFF, map);
  }

  function closeGuide() { if (guide.open) guide.close(); }
  // 체크를 바꾸는 즉시 저장 — 어떤 방법으로 닫든(버튼 · 바깥 클릭 · Esc · 다른 앱으로 전환) 유지된다
  guideMute.addEventListener('change', function () {
    if (guideKindShown) setGuideOff(guideKindShown, guideMute.checked);
  });
  guideOk.addEventListener('click', function () { var fn = guideOnOk; closeGuide(); if (fn) fn(); });
  guideCancel.addEventListener('click', closeGuide);

  function showGuide(kind) {
    var b = '<b>' + escapeHtml(env.label) + '</b>';
    var c = { cancel: '그냥 보기', onOk: null };
    if (kind === 'chrome') {
      c.title = 'Chrome 에서 열까요?';
      c.html = (env.inApp
          ? '<p>지금은 ' + b + ' 안의 브라우저로 열려 있어 홈 화면에 앱을 설치할 수 없습니다.</p>'
          : '<p>지금은 ' + b + ' 에서 열려 있습니다.</p>') +
        '<p>Chrome 에서 열면 홈 화면에 세계 시계를 설치할 수 있고, 설치 후에는 네트워크 없이도 실행됩니다.</p>';
      c.ok = 'Chrome 으로 열기';
      c.onOk = openInChrome;
    } else if (kind === 'install') {
      c.title = '세계 시계를 설치할까요?';
      c.html = '<p>홈 화면에 아이콘이 추가되고, 주소창 없는 앱 화면으로 실행됩니다.</p>' +
        '<p>설치 후에는 네트워크 없이도 동작합니다.</p>';
      c.ok = '설치';
      c.cancel = '나중에';
      c.onOk = promptInstall;
    } else if (kind === 'iosSafari') {
      var kakao = env.inApp && env.inApp.kakao;
      c.title = 'Safari 에서 열까요?';
      c.html = '<p>지금은 ' + b + (env.inApp ? ' 안의 브라우저로' : ' 에서') + ' 열려 있어 홈 화면에 추가할 수 없습니다. ' +
        (env.inApp ? '' : '이 iOS 버전에서는 ') + '<b>Safari</b> 에서 홈 화면에 추가할 수 있습니다.</p>' +
        (kakao
          ? '<p>Safari 로 열면 홈 화면에 세계 시계를 추가할 수 있고, 추가 후에는 네트워크 없이도 실행됩니다.</p>'
          : '<p>주소를 복사한 뒤 Safari 주소창에 붙여 넣으세요. 메뉴에 <b>Safari 로 열기</b> 나 <b>다른 브라우저로 열기</b> 가 있으면 그것을 써도 됩니다.</p>' +
            '<p class="guide-url">' + escapeHtml(appUrl()) + '</p>');
      c.ok = kakao ? 'Safari 로 열기' : '주소 복사';
      c.onOk = kakao
        ? function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(appUrl()); }
        : function () {
            copyUrl().then(function (ok) {
              toast(ok ? '주소를 복사했습니다. Safari 주소창에 붙여 넣으세요.' : '복사하지 못했습니다. 위 주소를 길게 눌러 복사하세요.', 4200);
            });
          };
    } else if (kind === 'iosAddHome') {
      c.title = '홈 화면에 추가하세요';
      c.html = '<p>홈 화면에 추가하면 아이콘으로 바로 실행되고, 네트워크 없이도 동작합니다.</p>' +
        '<ol class="steps">' +
        '<li><span class="no">1</span><span>' + ICON_SHARE + ' <b>공유</b> 버튼을 누릅니다. ' +
          (env.iosSafari ? '(아이폰은 아래쪽, 아이패드는 위쪽. 보이지 않으면 <b>⋯</b> 메뉴 안에 있습니다)'
                         : '(주소창 옆 또는 <b>⋯</b> 메뉴 안에 있습니다)') + '</span></li>' +
        '<li><span class="no">2</span><span>목록을 올려 ' + ICON_ADD + ' <b>홈 화면에 추가</b> 를 누릅니다.</span></li>' +
        '<li><span class="no">3</span><span>오른쪽 위 <b>추가</b> 를 누르면 끝입니다. (<b>웹 앱으로 열기</b> 가 보이면 켠 상태로 둡니다)</span></li>' +
        '</ol>';
      c.ok = '알겠습니다';
      c.cancel = null;
    } else {
      return;
    }
    guideTitle.textContent = c.title;
    guideText.innerHTML = c.html;
    guideOk.textContent = c.ok;
    guideCancel.hidden = !c.cancel;
    guideCancel.textContent = c.cancel || '';
    guideOnOk = c.onOk;
    guideKindShown = kind;
    guideMute.checked = isGuideOff(kind);
    if (dlg.open) dlg.close();
    if (guide.showModal) guide.showModal(); else guide.setAttribute('open', '');
  }
  guide.addEventListener('click', function (e) { if (e.target === guide) closeGuide(); }); // 바깥 클릭 시 닫기

  /** 실행마다 한 번만 자동으로 띄운다 (닫으면 같은 실행 중에는 다시 안 뜸) */
  var autoShown = false;
  function autoGuide(kind) {
    if (autoShown || !kind || isGuideOff(kind)) return;
    autoShown = true;
    setTimeout(function () { if (!dlg.open && !guide.open) showGuide(kind); }, GUIDE_DELAY_MS);
  }

  var installBtn = document.getElementById('installBtn');
  var deferredPrompt = null;
  function updateInstallBtn() {
    installBtn.hidden = !(deferredPrompt || guideKind());
  }
  function promptInstall() {
    if (!deferredPrompt) {
      toast('브라우저 메뉴의 "앱 설치" 를 이용하세요', 4200);
      return;
    }
    var p = deferredPrompt;
    deferredPrompt = null;
    p.prompt();
    p.userChoice.then(function () { updateInstallBtn(); }, function () { updateInstallBtn(); });
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    updateInstallBtn();
    // Android 에서 Chrome 전환 안내 대상이 아니면(Chrome 등) 설치 창을 자동으로 묻는다
    if (env.isAndroid && !env.standalone && !guideKind()) autoGuide('install');
  });
  // 헤더 '앱 설치': 설치 창이 가능하면 설치, 아니면 해당 환경의 안내를 다시 보여 준다
  installBtn.addEventListener('click', function () {
    if (deferredPrompt) promptInstall();
    else showGuide(guideKind());
  });
  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    installBtn.hidden = true;
    closeGuide();
    toast('설치되었습니다');
  });
  updateInstallBtn();
  autoGuide(guideKind());

  // 서비스 워커: http(s) 에서만 동작 (file:// 로 열면 건너뜀)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 오프라인 캐시 미사용 */ });
    });
  }

  // 앱 정보 창 - 헤더 버전 배지를 누르면 연다
  var about = document.getElementById('about');
  var appVer = document.getElementById('appVer');
  var aboutStatus = document.getElementById('aboutStatus');
  function closeAbout() { if (about.open) about.close(); }
  // 모달 창은 페이지 토스트를 덮어 흐리게 만들므로, 결과는 창 안에 뚜렷하게 표시한다
  function aboutMsg(msg, isError) {
    aboutStatus.textContent = msg;
    aboutStatus.classList.toggle('error', !!isError);
    aboutStatus.hidden = false;
  }
  appVer.addEventListener('click', function () {
    if (dlg.open) dlg.close();
    closeGuide();
    aboutStatus.hidden = true;   // 다시 열 때는 이전 결과를 지운다
    if (about.showModal) about.showModal(); else about.setAttribute('open', '');
  });
  document.getElementById('aboutClose').addEventListener('click', closeAbout);
  about.addEventListener('click', function (e) { if (e.target === about) closeAbout(); }); // 바깥 클릭 시 닫기

  // 이메일은 HTML 원문에 통째로 두지 않고 실행 중에 조립한다 (주소 수집 봇 대비)
  document.getElementById('aboutMail').textContent = ['changwon.heo', 'gmail.com'].join('@');
  // 앱명 · 버전 · 빌드 일시(분까지) - 예: WorldClock v1.1.1 (Build: 2026-10-03 20:06)
  document.getElementById('aboutTitle').textContent =
    'WorldClock v' + APP_VERSION + ' (Build: ' + BUILD_DATE.slice(0, 16) + ')';

  // 업데이트 확인 - 서버의 sw.js 가 바뀌었으면 새 버전을 받아 다시 연다
  // (sw.js 가 skipWaiting + clients.claim 이므로 설치되면 곧바로 controllerchange 가 온다)
  document.getElementById('aboutUpdate').addEventListener('click', function () {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) {
      aboutMsg('이 실행 방식에서는 업데이트를 확인할 수 없습니다', true); return;
    }
    if (navigator.onLine === false) { aboutMsg('오프라인 상태입니다', true); return; }
    aboutMsg('업데이트를 확인하는 중입니다…');
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) { aboutMsg('최신 버전입니다 (v' + APP_VERSION + ')'); return; }
      return reg.update().then(function () {
        if (reg.installing || reg.waiting) {
          navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
          aboutMsg('새 버전을 받는 중입니다… 잠시 후 다시 열립니다');
        } else {
          aboutMsg('최신 버전입니다 (v' + APP_VERSION + ')');
        }
      });
    }).catch(function () { aboutMsg('업데이트를 확인하지 못했습니다', true); });
  });

  document.getElementById('appVerText').textContent = 'v' + APP_VERSION;   // 헤더 버전 배지
  fmt12.setAttribute('aria-pressed', String(hour12));
  fmt24.setAttribute('aria-pressed', String(!hour12));
  render();
})();
</script>
</body>
</html>
